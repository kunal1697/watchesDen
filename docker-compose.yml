# docker compose up --build
# website: http://localhost:3000

x-service-env: &service-env
  EUREKA_URL: http://discovery-server:8761/eureka
  JWT_SECRET: ${JWT_SECRET:-aeon-local-dev-secret-change-me-please-32b+}
  DB_USER: ${POSTGRES_USER:-aeon}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-aeon}
  JAVA_OPTS: -XX:MaxRAMPercentage=75 -XX:+UseSerialGC

x-healthcheck: &actuator-health
  interval: 10s
  timeout: 5s
  retries: 30
  start_period: 40s

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aeon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aeon}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aeon}"]
      interval: 5s
      timeout: 5s
      retries: 20

  discovery-server:
    build: { context: ./backend, args: { SERVICE: discovery-server } }
    image: watchesden/discovery-server
    ports:
      - "8761:8761"
    healthcheck:
      <<: *actuator-health
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]

  user-service:
    build: { context: ./backend, args: { SERVICE: user-service } }
    image: watchesden/user-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/aeon_users
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@watchesden.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
    depends_on:
      postgres: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
    healthcheck:
      <<: *actuator-health
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]

  product-service:
    build: { context: ./backend, args: { SERVICE: product-service } }
    image: watchesden/product-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/aeon_products
    depends_on:
      postgres: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
    healthcheck:
      <<: *actuator-health
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]

  order-service:
    build: { context: ./backend, args: { SERVICE: order-service } }
    image: watchesden/order-service
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/aeon_orders
    depends_on:
      postgres: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
      product-service: { condition: service_healthy }
    healthcheck:
      <<: *actuator-health
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]

  api-gateway:
    build: { context: ./backend, args: { SERVICE: api-gateway } }
    image: watchesden/api-gateway
    environment:
      <<: *service-env
      CORS_ORIGINS: http://localhost:*
    ports:
      - "8080:8080"
    depends_on:
      discovery-server: { condition: service_healthy }
      user-service: { condition: service_healthy }
      product-service: { condition: service_healthy }
      order-service: { condition: service_healthy }
    healthcheck:
      <<: *actuator-health
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]

  frontend:
    build: ./frontend
    image: watchesden/frontend
    ports:
      - "3000:80"
    depends_on:
      api-gateway: { condition: service_healthy }

volumes:
  pgdata:
