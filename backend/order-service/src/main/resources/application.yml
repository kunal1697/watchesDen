server:
  port: 8083

spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aeon_orders}
    username: ${DB_USER:aeon}
    password: ${DB_PASSWORD:aeon}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.default_batch_fetch_size: 50
  flyway:
    enabled: true
  data:
    web:
      pageable:
        max-page-size: 50

aeon:
  product-service:
    url: ${PRODUCT_SERVICE_URL:http://product-service}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
