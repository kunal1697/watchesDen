server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aeon_users}
    username: ${DB_USER:aeon}
    password: ${DB_PASSWORD:aeon}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

aeon:
  jwt:
    secret: ${JWT_SECRET:aeon-local-dev-secret-change-me-please-32b+}
    ttl: PT24H
  admin:
    email: ${ADMIN_EMAIL:admin@watchesden.com}
    password: ${ADMIN_PASSWORD:Admin@123}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
